<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            #container {
                display: flex;
                flex-direction: column;
                height: 100vh;
                width: 100vw;
                justify-content: center;
                align-items: center;
                background-color: #ebd7ff;
            }

            html, body {
                margin: 0;
                padding: 0;
            }

            #content {
                font-family: sans-serif;
            }

            /*
            #bnuuy {
                animation: rotate 1s infinite linear;
            }

            @keyframes rotate {
                from { transform: rotateY(0deg); }
                to { transform: rotateY(360deg); }
            }
            */
        </style>

        <script>
            const rotateBnuuy = () => {
                const bnuuyImage = document.getElementById("bnuuy");
                const bnuuyRotationOriginal = parseInt(bnuuyImage.dataset.horizontalRotation);
                const bnuuyRotationNew = bnuuyRotationOriginal + 3;
                bnuuyImage.dataset.horizontalRotation = bnuuyRotationNew.toString();

                bnuuyImage.animate([
                    // key frames
                    { transform: `rotateY(0deg) rotateX(${bnuuyRotationOriginal}deg)` },
                    { transform: `rotateY(360deg) rotateX(${bnuuyRotationNew}deg)` }
                ], {
                    // sync options
                    duration: 1000,
                    iterations: 1,
                    easing: "linear",
                });
                // bnuuyImage.style.transform = `rotateX(${bnuuyRotation}deg)`;
            }

            document.addEventListener("DOMContentLoaded", function() {
                rotateBnuuy();
                const bnuuyInterval = window.setInterval(rotateBnuuy, 1000);
            });
        </script>
    </head>
    <body>
        <div id="container">
            <img
                id="bnuuy"
                width="300"
                src="./bnuy.png"
                data-horizontal-rotation="0"
            >
            <p id="content">
                *-eek!<br>
                this website works now!!!! :3*
            </p>
        </div>
    </body>
</html>
